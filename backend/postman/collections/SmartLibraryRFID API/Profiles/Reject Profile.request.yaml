$kind: http-request
name: Reject Profile
order: 6000
method: PATCH
url: '{{base_url}}/api/profiles/{{profile_id}}/reject'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
body:
  type: json
  content: |-
    {
      "rejectionReason": "Does not meet the requirements"
    }
