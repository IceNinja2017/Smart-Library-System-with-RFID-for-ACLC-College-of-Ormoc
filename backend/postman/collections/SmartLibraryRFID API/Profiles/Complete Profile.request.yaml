$kind: http-request
order: 1000
method: POST
url: '{{base_url}}/api/profiles/complete'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Juan dela Cruz",
      "contactNumber": "09123456789",
      "usn": "2024-00001",
      "requestedRole": "STUDENT"
    }
