$kind: collection
description: |-
  API collection for the SmartLibraryRFID backend.
  Covers authentication (register, sign-in, next-step) and user profile management.

  ## Getting started
  1. Select the **SmartLibraryRFID - Local** environment.
  2. Run **Register** to create an account, then **Sign In** — the access token is saved automatically to `access_token`.
  3. Use **Complete Profile** to submit your profile for approval, then **Get My Profile** to verify it.
variables:
