$kind: http-request
order: 6000
method: PUT
url: '{{base_url}}/api/books/:bookId'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
    description: 'Admin access token required'
pathVariables:
  - key: bookId
    value: ''
    description: 'The ID of the book to update'
body:
  type: json
  content: |-
    {
      "title": "The Great Gatsby (Updated)",
      "author": "F. Scott Fitzgerald",
      "isbn": "978-0-7432-7356-5",
      "category": "Classic Fiction",
      "shelfNumber": "B-05",
      "imageUrl": null,
      "copies": [
        { "id": "copy-id-here", "rfidTag": "RFID-001-UPDATED" }
      ]
    }
examples: './.resources/Update Book.resources/examples'
