$kind: http-example
name: '500 Internal Server Error'
order: 2000
request:
  url: '{{base_url}}/api/books'
  method: GET
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Failed to fetch books."
      }
