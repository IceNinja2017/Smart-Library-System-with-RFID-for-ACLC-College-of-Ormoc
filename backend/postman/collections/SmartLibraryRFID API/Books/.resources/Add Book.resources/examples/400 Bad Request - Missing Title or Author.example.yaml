$kind: http-example
name: '400 Bad Request - Missing Title or Author'
order: 2000
request:
  url: '{{base_url}}/api/books'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Book title and author are required."
      }
