$kind: http-example
name: '400 Bad Request - No Copies'
order: 3000
request:
  url: '{{base_url}}/api/books'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Add at least one physical book copy."
      }
