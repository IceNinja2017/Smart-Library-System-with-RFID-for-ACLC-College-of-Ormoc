$kind: http-example
name: '409 Conflict - Duplicate ISBN or RFID'
order: 6000
request:
  url: '{{base_url}}/api/books'
  method: POST
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "The ISBN or an RFID tag already exists. Please check the values and try again."
      }
