$kind: http-example
name: '403 Forbidden'
order: 5000
request:
  url: '{{base_url}}/api/books'
  method: POST
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Admin access required."
      }
