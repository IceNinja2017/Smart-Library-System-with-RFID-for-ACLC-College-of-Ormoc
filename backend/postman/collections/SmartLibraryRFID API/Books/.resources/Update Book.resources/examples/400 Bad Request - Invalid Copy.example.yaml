$kind: http-example
name: '400 Bad Request - Invalid Copy'
order: 2000
request:
  url: '{{base_url}}/api/books/clx1a2b3c4d5e6f7g8h9i0j1'
  method: PUT
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "One or more copies do not belong to this book."
      }
