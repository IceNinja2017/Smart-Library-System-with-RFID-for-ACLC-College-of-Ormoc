$kind: http-example
name: '404 Not Found'
order: 3000
request:
  url: '{{base_url}}/api/books/nonexistent-id'
  method: PUT
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Active book not found."
      }
