$kind: http-request
order: 7000
method: PATCH
url: '{{base_url}}/api/books/:bookId/archive'
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
    description: 'Admin access token required'
pathVariables:
  - key: bookId
    value: ''
    description: 'The ID of the book to archive'
examples: './.resources/Archive Book.resources/examples'
